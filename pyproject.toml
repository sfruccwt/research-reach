[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-reach"
version = "0.4.0"
description = "File-oriented, three-stage research workflow for Codex"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research-reach-opening = "research_reach.opening:main"
research-reach-search = "research_reach.search:main"
research-reach-synthesis = "research_reach.synthesis:main"

[tool.setuptools.packages.find]
where = ["src"]
